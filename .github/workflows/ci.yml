name: Website checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Generate and reconcile synthetic exports
        run: pnpm qa:exports
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independently verify workbook values and stored formatting
        run: |
          python -m pip install -r scripts/qa-requirements.txt
          python scripts/verify-qa-exports.py
      - run: pnpm build
      - name: Build for repository subpath
        run: pnpm build --base=/ClassAttendance/
      - name: Retain synthetic workbook validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attendance-export-qa
          path: artifacts/qa-exports/
          if-no-files-found: warn
          retention-days: 14
